<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.profile}">My Profile</title>
    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=1200');
            --block-bg: rgba(255,255,255,0.92);
            --confirm-blue: #0066cc;
            --overdue-red: #cc0000;
            --due-soon: #e67e22;
            --text-dark: #1a1a2e;
        }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        .background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-image) no-repeat center center/cover; z-index: -1; }
        .upper-tool-row { display: flex; justify-content: space-between; padding: 20px 35px; background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); }
        .tab-item { font-size: 18px; font-weight: 600; text-decoration: none; color: var(--text-dark); margin: 0 15px; }
        .user-profile { width: 45px; height: 45px; border-radius: 50%; background: #0066cc; color: white; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; }
        main { padding: 40px; max-width: 1000px; margin: 0 auto; }
        .large-profile { width: 150px; height: 150px; border-radius: 50%; background: #0066cc; color: white; display: flex; align-items: center; justify-content: center; font-size: 60px; margin: 0 auto 20px; }
        .welcome-text { text-align: center; font-size: 32px; margin-bottom: 30px; color: var(--text-dark); }
        .stats-container { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { background: var(--block-bg); border-radius: 15px; padding: 20px; flex: 1; text-align: center; }
        .stat-number { font-size: 36px; font-weight: bold; color: var(--confirm-blue); }
        .stat-label { font-size: 14px; color: #555; }
        .info-container, .borrow-section, .history-section { background: var(--block-bg); border-radius: 20px; padding: 25px; margin-bottom: 30px; }
        .info-item { padding: 15px 0; border-bottom: 1px solid #ddd; }
        .info-label { font-size: 14px; color: #555; }
        .info-value { font-size: 18px; font-weight: 500; color: var(--text-dark); }
        .borrow-item, .history-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #ddd; }
        .book-title { font-weight: bold; font-size: 18px; color: var(--text-dark); }
        .due-overdue { color: var(--overdue-red); font-weight: 800; }
        .due-soon { color: var(--due-soon); font-weight: bold; }
        .due-normal { color: #28a745; }
        .due-ok { color: #1e8449; font-weight: 600; }
        .due-warn { color: #d35400; font-weight: 700; }
        .due-urgent { color: #c0392b; font-weight: 800; }
        .borrow-alert-icon { margin-left: 6px; }
        .fee-note { font-size: 14px; color: #444; margin-top: 8px; font-weight: 600; }
        .profile-legend { font-size: 13px; color: #666; margin: 0 0 14px 0; line-height: 1.5; }
        .btn-return { background-color: var(--confirm-blue); color: white; padding: 8px 20px; border-radius: 25px; border: none; cursor: pointer; }
        .btn-logout { background-color: var(--overdue-red); color: white; padding: 12px 30px; border-radius: 25px; border: none; cursor: pointer; display: block; margin: 0 auto; }
        h3 { color: var(--text-dark); margin-top: 0; }
        .empty-message { text-align: center; padding: 30px; color: #666; }
    </style>
</head>
<body>
<div class="background"></div>
<nav th:replace="~{fragments/nav :: navUser('profile')}"></nav>
<main>
    <div class="large-profile" th:text="${#strings.substring(user.fullName, 0, 1)}"></div>
    <h1 class="welcome-text" th:text="|#{profile.welcome}, ${user.fullName}!|"></h1>
    <div class="stats-container">
        <div class="stat-card"><div class="stat-number" th:text="${totalBorrowed}">0</div><div class="stat-label" th:text="#{profile.totalBorrowed}">Total</div></div>
        <div class="stat-card"><div class="stat-number" th:text="${currentCount}">0</div><div class="stat-label" th:text="#{profile.current}">Current</div></div>
        <div class="stat-card"><div class="stat-number" th:text="${returnedCount}">0</div><div class="stat-label" th:text="#{profile.returned}">Returned</div></div>
        <div class="stat-card"><div class="stat-number" th:text="${overdueCount}">0</div><div class="stat-label" th:text="#{profile.overdue}">Overdue</div></div>
    </div>
    <div class="info-container">
        <div class="info-item"><div class="info-label" th:text="#{profile.email}">Email</div><div class="info-value" th:text="${user.email}"></div></div>
        <div class="info-item"><div class="info-label" th:text="#{profile.fullName}">Name</div><div class="info-value" th:text="${user.fullName}"></div></div>
    </div>
    <div class="borrow-section">
        <h3 th:text="#{profile.currentlyBorrowed}">Currently Borrowed</h3>
        <p class="profile-legend" th:text="#{profile.dueLegend}"></p>
        <div th:if="${currentBorrows.empty}" class="empty-message" th:text="#{profile.noBorrows}"></div>
        <div th:each="record : ${currentBorrows}" class="borrow-item">
            <div>
                <div class="book-title">
                    <span th:text="${record.book.title}"></span>
                    <span th:if="${record.urgencyLevel >= 1}" class="borrow-alert-icon" th:title="#{profile.dueLegend}">!</span>
                </div>
                <div><span th:text="#{profile.labelBorrowed}"></span>: <span th:text="${#temporals.format(record.borrowDate, 'yyyy-MM-dd')}"></span></div>
                <div>
                    <span th:text="#{profile.labelDue}"></span>:
                    <span th:text="${#temporals.format(record.dueDate, 'yyyy-MM-dd')}"
                          th:class="${record.urgencyLevel == 3} ? 'due-overdue' : (${record.urgencyLevel == 2} ? 'due-urgent' : (${record.urgencyLevel == 1} ? 'due-warn' : 'due-ok'))"></span>
                    <span th:if="${record.overdue}" class="due-overdue" style="margin-left:6px;" th:text="#{profile.overdueEx}"></span>
                </div>
                <div th:if="${record.overdue}" class="fee-note" th:text="#{profile.feeEstimate(${record.estimatedOverdueFeeHkd})}"></div>
            </div>
            <form action="/return-book" method="post"><input type="hidden" name="bookId" th:value="${record.book.id}"><button type="submit" class="btn-return" th:text="#{profile.return}">Return</button></form>
        </div>
    </div>
    <div class="history-section">
        <h3 th:text="#{profile.history}">History</h3>
        <div th:if="${history.empty}" class="empty-message" th:text="#{profile.noHistory}"></div>
        <div th:each="record : ${history}" class="history-item">
            <div>
                <div class="book-title" th:text="${record.book.title}"></div>
                <div>
                    <span th:text="#{profile.labelBorrowed}"></span>:
                    <span th:text="${#temporals.format(record.borrowDate, 'yyyy-MM-dd')}"></span>
                    <span th:if="${record.returned}"> | <span th:text="#{profile.labelReturned}"></span>:
                        <span th:text="${#temporals.format(record.returnDate, 'yyyy-MM-dd')}"></span>
                    </span>
                </div>
            </div>
            <div>
                <span th:if="${record.returned}" style="color:#28a745;"><span th:text="#{profile.returnedOk}"></span></span>
                <span th:if="${!record.returned and record.overdue}" class="due-overdue" th:text="#{profile.overdueEx}"></span>
            </div>
        </div>
    </div>
    <a href="/logout"><button class="btn-logout" th:text="#{profile.logout}">Logout</button></a>
</main>
</body>
</html>
