<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}">Login</title>
    <style>
        :root {
            --bg-light-blue: #e8f0fe;
            --block-bg: rgba(255, 255, 255, 0.9);
            --edge-light-blue: #0066cc;
            --confirm-blue: #0066cc;
            --text-dark: #1a1a2e;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-light-blue); }
        .upper-tool-row { display: flex; justify-content: space-between; padding: 20px 35px; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); }
        .tab-item { font-size: 18px; font-weight: 600; color: var(--text-dark); text-decoration: none; }
        .active-tab { color: var(--edge-light-blue); border-bottom: 3px solid var(--edge-light-blue); }
        main { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80%; }
        .login-title { font-size: 42px; font-weight: 800; color: var(--text-dark); margin-bottom: 40px; }
        .login-container { width: 100%; max-width: 450px; }
        .input-group { margin-bottom: 20px; }
        .input-label { font-size: 16px; color: #333; margin-bottom: 8px; display: block; font-weight: 600; }
        .login-input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ccc; background: var(--block-bg); font-size: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border-radius: 25px; font-size: 18px; font-weight: 600; border: none; cursor: pointer; }
        .btn-confirm { background-color: var(--confirm-blue); color: white; margin-top: 20px; }
        .btn-registrate { background-color: #e0e0e0; color: var(--text-dark); margin-top: 10px; }
        .error-message { color: #cc0000; text-align: center; margin-top: 10px; }
        .forgot-link { display: block; text-align: right; margin-top: 8px; font-size: 14px; }
        .forgot-link a { color: var(--confirm-blue); text-decoration: none; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navGuest('login')}"></nav>
<main>
    <h1 class="login-title" th:text="#{login.title}">Login</h1>
    <div class="login-container">
        <form th:action="@{/login}" method="post">
            <div class="input-group">
                <label class="input-label" th:text="#{login.email}">Email</label>
                <input type="email" name="email" class="login-input" required>
            </div>
            <div class="input-group">
                <label class="input-label" th:text="#{login.password}">Password</label>
                <input type="password" name="password" class="login-input" required>
            </div>
            <div class="forgot-link"><a th:href="@{/forgot-password}" th:text="#{login.forgotPassword}">Forgot password?</a></div>
            <div th:if="${error}" class="error-message" th:text="${error}"></div>
            <button type="submit" class="btn btn-confirm" th:text="#{login.submit}">Confirm</button>
        </form>
        <a th:href="@{/register}" style="text-decoration: none;"><button type="button" class="btn btn-registrate" th:text="#{login.registerPrompt}">Register</button></a>
    </div>
</main>
</body>
</html>
