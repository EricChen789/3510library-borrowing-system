<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{forgot.title}">Forgot password</title>
    <style>
        :root { --bg-light-blue: #e8f0fe; --block-bg: rgba(255,255,255,0.9); --confirm-blue: #0066cc; --text-dark: #1a1a2e; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-light-blue); }
        .upper-tool-row { display: flex; justify-content: space-between; padding: 20px 35px; background: rgba(255,255,255,0.8); }
        .tab-item { font-size: 18px; font-weight: 600; text-decoration: none; color: var(--text-dark); }
        .active-tab { color: #0066cc; border-bottom: 3px solid #0066cc; }
        main { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 75vh; padding: 20px; }
        .page-title { font-size: 36px; font-weight: 800; color: var(--text-dark); margin-bottom: 16px; }
        .hint { max-width: 480px; text-align: center; color: #444; margin-bottom: 24px; }
        .box { width: 100%; max-width: 450px; background: var(--block-bg); padding: 28px; border-radius: 16px; box-sizing: border-box; }
        .input-group { margin-bottom: 18px; }
        .input-label { font-size: 16px; color: #333; margin-bottom: 8px; display: block; font-weight: 600; }
        .login-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border-radius: 25px; font-size: 17px; font-weight: 600; border: none; cursor: pointer; background: var(--confirm-blue); color: white; }
        .error-message { color: #cc0000; text-align: center; margin-bottom: 12px; }
        .success-box { background: #e8f5e9; border: 1px solid #28a745; border-radius: 12px; padding: 16px; margin-bottom: 16px; text-align: center; }
        .pwd { font-family: ui-monospace, Consolas, monospace; font-size: 18px; font-weight: 700; color: #1b5e20; word-break: break-all; }
        .link-back { display: block; text-align: center; margin-top: 16px; color: var(--confirm-blue); text-decoration: none; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: navGuest('forgot')}"></nav>
<main>
    <h1 class="page-title" th:text="#{forgot.title}">Forgot password</h1>
    <p class="hint" th:text="#{forgot.description}">Enter your email.</p>
    <div class="box">
        <div th:if="${error}" class="error-message" th:text="${error}"></div>
        <div th:if="${success}" class="success-box">
            <div th:text="#{forgot.success}">Your new password:</div>
            <div class="pwd" th:text="${newPassword}"></div>
            <p style="margin-top:12px;font-size:14px;color:#333;" th:text="#{forgot.hint}"></p>
        </div>
        <form th:unless="${success}" th:action="@{/forgot-password}" method="post">
            <div class="input-group">
                <label class="input-label" th:text="#{forgot.email}">Email</label>
                <input type="email" name="email" class="login-input" required>
            </div>
            <button type="submit" class="btn" th:text="#{forgot.submit}">Reset</button>
        </form>
        <a th:href="@{/login}" class="link-back" th:text="#{forgot.back}">Back</a>
    </div>
</main>
</body>
</html>
